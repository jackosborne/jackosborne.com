<a class="skip-link" href="#main">Skip to Content</a>

<header class="site-header" role="banner">
  <div class="wrapper site-header__grid">
    {% if page.url == '/' %}
    <span class="site-header__home" aria-current="page">Home</span>
    {% else %}
    <a class="site-header__home" href="/">Home</a>
    {% endif %}

    {% if page.url != '/' %}
    <nav class="site-nav" aria-label="Current page">
      <ul>
        {% include "partials/navigation.html" %}
      </ul>
    </nav>
    {% endif %}

    <div class="site-header__email">
      <button class="email" type="button" data-copy-email="{{ site.email }}" aria-label="Copy {{ site.email }}">
        <span class="email__address" aria-hidden="true">{{ site.email }}</span>
        <span class="email__feedback" aria-hidden="true">Email copied</span>
      </button>
      <span class="visually-hidden copy-status" role="status" aria-live="polite" aria-atomic="true"></span>
    </div>
  </div>
</header>
